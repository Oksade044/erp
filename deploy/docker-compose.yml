# ERP server deployment — API + PostgreSQL + Redis + Nginx (TDD §32).
# Lokal SQLite-dən buraya keçid app kodunu dəyişmir: yalnız provider config + connection string.
#
# İstifadə:
#   docker compose -f deploy/docker-compose.yml up -d
#   (əvvəlcə Postgres migration-ları yaradılmalıdır — bax deploy/README.md)

services:
  postgres:
    image: postgres:17-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_dev_password}
    volumes:
      - erp-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: erp-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: Postgres
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=erp;Username=erp;Password=${POSTGRES_PASSWORD:-erp_dev_password}"
      Jwt__Key: ${JWT_KEY:-serverde-bu-acar-secret-store-dan-gelmelidir-en-azi-32-bayt!!}
    expose:
      - "8080"
    restart: unless-stopped

  # Reverse proxy — mobil tətbiq üçün avtomatik HTTPS (Let's Encrypt).
  # DOMAIN dəyişənini VPS domeninizə təyin edin (məs. erp.sizindomen.az).
  caddy:
    image: caddy:2-alpine
    container_name: erp-caddy
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:-erp.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - erp-caddy-data:/data
      - erp-caddy-config:/config
    restart: unless-stopped

volumes:
  erp-pgdata:
  erp-caddy-data:
  erp-caddy-config:
