# Codemagic CI/CD — ERP İşçi mobil tətbiqi (.NET MAUI) iOS .ipa build
# ------------------------------------------------------------------------------
# Bu fayl repo kökündə olduğu üçün Codemagic Flutter AVTOMATİK-AŞKARLAMANI ATLAYIR.
# Əvvəlki "Failed to install dependencies for pubspec file ... Directory was not found"
# xətası məhz buna görə idi: layihə Flutter DEYİL (pubspec.yaml yoxdur), .NET MAUI-dir (C#).
#
# Codemagic-də BİR DƏFƏLİK quraşdırılmalı olanlar (UI-dan, kod deyil):
#   1) Apple Developer Program üzvlüyü + App Store Connect girişi.
#   2) Codemagic → Team settings → Integrations → App Store Connect:
#      API key əlavə edin, ona ad verin və aşağıdakı `app_store_connect: CodemagicASC`
#      dəyərini HƏMİN adla əvəz edin.
#   3) Bundle Id `az.erp.employee` — `fetch-signing-files --create` onu avtomatik yaradacaq,
#      və ya Apple Developer portalında əvvəlcədən qeydiyyatdan keçirin.
# ------------------------------------------------------------------------------

workflows:
  ios-maui:
    name: ERP İşçi — iOS (.ipa)
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      # ↓ Codemagic-dəki App Store Connect API key-in ADI ilə əvəz edin.
      app_store_connect: CodemagicASC

    environment:
      ios_signing:
        # app_store = App Store / TestFlight üçün. Cihaza birbaşa yükləmə üçün: ad_hoc
        distribution_type: app_store
        bundle_identifier: az.erp.employee
      vars:
        BUNDLE_ID: "az.erp.employee"

    scripts:
      - name: .NET 10 SDK təmin et (yoxdursa quraşdır)
        script: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then
            curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
            bash /tmp/dotnet-install.sh --channel 10.0 --install-dir "$HOME/.dotnet10"
            echo "DOTNET_ROOT=$HOME/.dotnet10" >> "$CM_ENV"
            echo "PATH=$HOME/.dotnet10:$PATH" >> "$CM_ENV"
          fi
      - name: .NET MAUI workload quraşdır (android + ios + maccatalyst)
        script: |
          dotnet --version
          dotnet workload install maui

      - name: İmza sertifikatı + App ID + provisioning profil yarat/gətir
        script: |
          set -x
          keychain initialize
          # 1) iOS Distribution sertifikatı MÜTLƏQ olmalıdır (fetch-signing-files --create
          #    yalnız profil yaradır, sertifikat YOX). Əvvəlcə yaratmağa çalış; hesabda artıq
          #    varsa (Apple max sayı) mövcudları götür (list boş olsa belə uğur qaytardığı üçün
          #    əvvəl create edirik). ⚠ API key rolu App Manager/Admin olmalıdır, yoxsa yaratma
          #    icazəsi olmaz və "No matching profiles" davam edər.
          app-store-connect create-certificate --type IOS_DISTRIBUTION --save \
            || app-store-connect list-certificates --type IOS_DISTRIBUTION --save
          # 2) Bundle ID (App ID) qeydiyyatı — idempotent.
          app-store-connect create-bundle-id "$BUNDLE_ID" --name "ERP Isci" --platform IOS || true
          # 3) App Store provisioning profilini gətir/yarat.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: .ipa qur (yalnız iOS hədəfi)
        script: |
          dotnet publish src/Clients/ERP.Mobile/ERP.Mobile.csproj \
            -c Release \
            -f net10.0-ios

    artifacts:
      - "**/*.ipa"

    publishing:
      email:
        recipients:
          - seymur15abbasli@gmail.com
      # İstəsəniz avtomatik TestFlight-a göndərmə üçün aşağını açın:
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
